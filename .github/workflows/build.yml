name: Compilar app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TEM_CHAVE: ${{ secrets.KEYSTORE_BASE64 != '' && 'sim' || 'nao' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Versão do Flutter
        run: flutter --version

      - name: Preparar Android e web
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: bash tool/preparar_android.sh

      - name: Dependências
        run: flutter pub get

      - name: Ícone do app
        run: dart run flutter_launcher_icons

      - name: Análise do código
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Testes
        run: flutter test

      - name: Número da versão
        id: ver
        run: echo "n=$(( 100 + ${{ github.run_number }} ))" >> "$GITHUB_OUTPUT"

      - name: APK (para instalar e testar)
        run: flutter build apk --release --build-number=${{ steps.ver.outputs.n }}

      - name: AAB (para a Play Store)
        if: ${{ env.TEM_CHAVE == 'sim' }}
        run: flutter build appbundle --release --build-number=${{ steps.ver.outputs.n }}

      - name: Web (para os prints)
        run: flutter build web --release

      - name: Prints das telas
        run: |
          cd build/web
          python3 -m http.server 8080 >/dev/null 2>&1 &
          sleep 2
          mkdir -p ../../prints
          tirar() {
            google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
              --window-size=390,${3:-844} --force-device-scale-factor=2 \
              --virtual-time-budget=15000 \
              --screenshot="../../prints/$1.png" "http://localhost:8080/?demo=1$2" || true
          }
          tirar 1-inicio "" 1700
          tirar 2-extrato "&aba=1"
          tirar 3-menu-mais "&tela=menu"
          tirar 4-novo-gasto "&tela=lancar"
          tirar 5-nova-entrada "&tela=entrada"
          tirar 6-limites "&tela=limites"
          tirar 7-ajustes "&tela=ajustes"
          tirar 8-planejar "&aba=2" 2200
          tirar 9-cartoes "&tela=cartoes"
          tirar 10-cartao "&tela=cartao" 1300
          tirar 11-emprestimos "&tela=emprestimos"
          tirar 12-patrimonio "&aba=3" 2400
          tirar 13-lancar "&aba=3&sub=1" 1500
          tirar 14-ativos "&aba=3&sub=2"
          tirar 15-relatorios "&aba=3&sub=3" 2600
          tirar 16-avisos "&tela=avisos"
          tirar 17-busca "&tela=busca" 1400
          tirar 18-importar "&tela=importar"
          tirar 19-analise "&aba=1&analise=1" 6000
          tirar c1-inicio "&tema=claro" 1900
          tirar c2-extrato "&tema=claro&aba=1"
          tirar c3-analise "&tema=claro&aba=1&analise=1" 6000
          tirar c4-planejar "&tema=claro&aba=2" 2200
          tirar c5-patrimonio "&tema=claro&aba=3" 2400
          tirar c6-ajustes "&tema=claro&tela=ajustes"
          tirar c7-lancar "&tema=claro&tela=lancar"
          tirar i1-investido "&tela=invest"
          tirar g1-grafico-cheio "&aba=1&analise=1&tela=grafico"
          tirar l1-inicio "&tema=linho" 1900
          tirar l2-extrato "&tema=linho&aba=1"
          tirar l3-analise "&tema=linho&aba=1&analise=1" 3600
          tirar l4-planejar "&tema=linho&aba=2" 2200
          tirar l5-patrimonio "&tema=linho&aba=3" 2400
          tirar l6-ajustes "&tema=linho&tela=ajustes"
          tirar l7-lancar "&tema=linho&tela=lancar"
          tirar a1-abertura "&abertura=0.2"
          tirar a2-abertura "&abertura=0.32"
          tirar a2b-abertura "&abertura=0.55"
          tirar a3-abertura "&abertura=0.7"
          tirar a4-abertura-claro "&tema=claro&abertura=0.7"
          tirar i2-extrato-inv "&aba=1"
          tirar c8-cartao "&tema=claro&tela=cartao" 1300
          tirar c9-avisos "&tema=claro&tela=avisos"
          ls -la ../../prints

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: carteira-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Guardar AAB
        if: ${{ hashFiles('build/app/outputs/bundle/release/app-release.aab') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: carteira-aab
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Guardar prints
        uses: actions/upload-artifact@v4
        with:
          name: prints
          path: prints/

      - name: Publicar a versão para baixar no celular
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk carteira.apk
          ARQS="carteira.apk"
          if [ -f build/app/outputs/bundle/release/app-release.aab ]; then cp build/app/outputs/bundle/release/app-release.aab carteira.aab; ARQS="$ARQS carteira.aab"; fi
          gh release delete ultima -y --cleanup-tag 2>/dev/null || true
          gh release create ultima $ARQS --title "Última versão (build ${{ steps.ver.outputs.n }})" \
            --notes "Baixe o carteira.apk no celular e toque para instalar. Gerado automaticamente a partir do commit ${GITHUB_SHA::7}." --latest

      - name: Guardar prints na branch "saida"
        run: |
          mkdir -p /tmp/saida && cp prints/*.png /tmp/saida/ 2>/dev/null || true
          cd /tmp/saida
          git init -q -b saida
          git -c user.name="github-actions" -c user.email="actions@github.com" add -A
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -qm "Prints do build ${{ steps.ver.outputs.n }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" saida
