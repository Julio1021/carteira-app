<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/carteira-app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!--
    Uncomment the tag below to lay the app out underneath the parts of the
    screen that the device obstructs, such as a display cutout, the rounded
    corners of the screen, or a home indicator.

    Without it, the browser keeps the app clear of them, and `SafeArea` and
    `MediaQuery.paddingOf` report no padding. With it, the app covers the whole
    screen, and it is up to the app to keep its own content out of the way,
    which is what `SafeArea` is for.
  -->
  <!-- <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"> -->

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="carteira">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Diário da Carteira</title>
  <link rel="manifest" href="manifest.json">
<style>
  html,body{margin:0;background:#F2EEE6}
  @media (prefers-color-scheme: dark){html,body{background:#101119}#carregando .c{background:#1B1D2B}}
  #carregando{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;padding-top:16vh;gap:14px;font-family:system-ui,sans-serif}
  #carregando img{width:88px;height:88px;border-radius:22px;animation:p 1.3s ease-in-out infinite}
  #carregando .c{width:min(420px,86vw);height:76px;border-radius:18px;background:#E6E1D6;animation:b 1.3s ease-in-out infinite}
  #carregando .c.g{height:150px;margin-top:18px}
  @keyframes p{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  @keyframes b{0%,100%{opacity:.55}50%{opacity:1}}
</style>
</head>
<body>
  <div id="carregando"><img src="icons/Icon-192.png" alt=""><div class="c g"></div><div class="c"></div><div class="c"></div></div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
