name: carteira
description: "Diário da Carteira — controle de gastos, entradas e investimentos."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.3.2
  file_picker: ">=10.0.0 <12.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icone.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icone.png"
  min_sdk_android: 21
  adaptive_icon_background: "#14151F"
  adaptive_icon_foreground: "assets/icone_frente.png"
  web:
    generate: true
    image_path: "assets/icone.png"
    background_color: "#101119"
    theme_color: "#101119"
