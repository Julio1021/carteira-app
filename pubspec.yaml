name: carteira
description: "Diário da Carteira — controle de gastos, entradas e investimentos."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.3.2
  file_picker: ^13.3.2
  syncfusion_flutter_pdf: ">=29.1.33"
  fl_chart: ">=1.0.0 <2.0.0"
  google_sign_in: ^7.2.0
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icone.png
  fonts:
    - family: Jakarta
      fonts:
        - asset: assets/fonts/Jakarta-400.ttf
        - asset: assets/fonts/Jakarta-500.ttf
          weight: 500
        - asset: assets/fonts/Jakarta-600.ttf
          weight: 600
        - asset: assets/fonts/Jakarta-700.ttf
          weight: 700
        - asset: assets/fonts/Jakarta-800.ttf
          weight: 800

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icone.png"
  min_sdk_android: 21
  adaptive_icon_background: "assets/icone_fundo.png"
  adaptive_icon_foreground: "assets/icone_frente.png"
  web:
    generate: true
    image_path: "assets/icone.png"
    background_color: "#101119"
    theme_color: "#101119"
